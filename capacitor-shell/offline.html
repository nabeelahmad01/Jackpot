<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080a11" />
    <title>Jackpot Royals — Offline</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #080a11; color: #fff; }
      body { display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; box-sizing: border-box; }
      main { max-width: 360px; width: 100%; display: flex; flex-direction: column; align-items: center; }
      .icon-container { width: 80px; height: 80px; margin-bottom: 20px; border-radius: 20px; background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.25); display: grid; place-items: center; box-shadow: 0 0 30px rgba(255, 215, 0, 0.15); }
      .icon-container svg { width: 40px; height: 40px; fill: #ffd700; }
      h1 { color: #ffd700; font-size: 1.5rem; margin: 0 0 10px 0; font-weight: 700; letter-spacing: -0.02em; }
      p { color: #a3a8b8; font-size: 0.95rem; line-height: 1.6; margin: 0 0 24px 0; }
      .status-text { font-size: 0.825rem; color: #fbbf24; min-height: 20px; margin-bottom: 16px; font-weight: 500; transition: all 0.3s; }
      button { border: 0; border-radius: 12px; padding: 14px 24px; background: linear-gradient(135deg, #ffd700, #ffa500); color: #080a11; font-weight: 800; font-size: 0.95rem; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); transition: transform 0.2s, opacity 0.2s; outline: none; }
      button:active { transform: scale(0.97); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(8, 10, 17, 0.3); border-radius: 50%; border-top-color: #080a11; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="icon-container">
        <svg viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4a1 1 0 001.41 1.41l1.79-1.79C9.09 19.64 10.5 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8l8.1 8.1c-.83.45-1.79.7-2.8.7zm5.3-3.2L9.2 6.7C10.03 6.25 10.99 6 12 6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8z"/>
        </svg>
      </div>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet, then retry. Your installed app and account remain safe.</p>
      <div id="statusText" class="status-text"></div>
      <button type="button" id="retryBtn" onclick="tryReconnect()">
        <span id="btnText">Try again</span>
      </button>
    </main>

    <script>
      function getTargetUrl() {
        var ua = navigator.userAgent || '';
        if (/JackpotPortalNative/i.test(ua)) return 'https://jackpotroyals.com/admin';
        if (/JackpotDistributorNative/i.test(ua)) return 'https://jackpotroyals.com/distributor';

        try {
          var saved = localStorage.getItem('jackpot_last_online_url');
          if (saved && /^https:\/\/jackpotroyals\.com/i.test(saved)) {
            return saved;
          }
        } catch (e) {}

        return 'https://jackpotroyals.com/';
      }

      var isChecking = false;

      function updateStatus(msg, isErr) {
        var el = document.getElementById('statusText');
        if (el) {
          el.innerText = msg || '';
          el.style.color = isErr ? '#f87171' : '#fbbf24';
        }
      }

      function tryReconnect() {
        if (isChecking) return;
        isChecking = true;

        var btn = document.getElementById('retryBtn');
        var btnText = document.getElementById('btnText');
        var targetUrl = getTargetUrl();

        if (btn) btn.disabled = true;
        if (btnText) btnText.innerHTML = '<span class="spinner"></span>Checking connection...';
        updateStatus('Connecting to Jackpot server...', false);

        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timeoutId = setTimeout(function() {
          if (controller) controller.abort();
        }, 5000);

        fetch('https://jackpotroyals.com/api/push-health?t=' + Date.now(), {
          method: 'GET',
          cache: 'no-store',
          signal: controller ? controller.signal : undefined
        })
        .then(function(res) {
          clearTimeout(timeoutId);
          if (res.ok || res.status < 500) {
            updateStatus('Connection restored! Loading...', false);
            if (btnText) btnText.innerText = 'Connected!';
            window.location.replace(targetUrl);
          } else {
            throw new Error('Server unreachable');
          }
        })
        .catch(function() {
          clearTimeout(timeoutId);
          isChecking = false;
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerText = 'Try again';
          updateStatus('Internet connection unavailable. Please check Wi-Fi or mobile data.', true);
        });
      }

      window.addEventListener('online', function() {
        updateStatus('Internet restored! Reconnecting...', false);
        tryReconnect();
      });

      setInterval(function() {
        if (!isChecking && navigator.onLine) {
          tryReconnect();
        }
      }, 5000);
    </script>
  </body>
</html>
