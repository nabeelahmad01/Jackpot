<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080a11" />
    <title>Jackpot Royals — Offline</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #080a11; color: #fff; }
      body { display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      h1 { color: #ffd700; }
      p { color: #a3a8b8; line-height: 1.6; }
      button { border: 0; border-radius: 12px; padding: 12px 20px; background: #ffd700; color: #080a11; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet, then retry. Your installed app and account remain safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
